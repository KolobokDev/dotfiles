background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = rgb(200, 200, 200)
    inner_color = rgba(20, 20, 20, 0.8)
    outer_color = rgba(100, 100, 100, 0.5)
    check_color = rgba(204, 136, 34, 0.8)
    fail_color = rgba(204, 34, 34, 0.8)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 50
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}
